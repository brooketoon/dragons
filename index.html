<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dragon Fjord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24324a; --card:#fffdf6; --edge:#e8dcc0; --orange:#ff8a3d; --green:#36b36a; --blue:#3d8bfd;
  --common:#6cc06c; --rare:#3d9bff; --epic:#a965ff; --legendary:#ffb300;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:#bfe6ff;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{user-select:text;-webkit-user-select:text}
.codebox{width:100%;height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace;border-radius:14px;border:3px solid #cfd9e4;padding:8px;word-break:break-all;resize:none;color:var(--ink);background:#fff;margin:8px 0}
.codebox:focus{outline:none;border-color:var(--blue)}
.prof{position:relative}
.prof .art{max-width:200px;margin:0 auto 4px}
.pname{font-family:inherit;font-size:20px;text-align:center;padding:10px 12px;border-radius:14px;border:3px solid #cfd9e4;width:100%;margin:6px 0 12px;color:var(--ink)}
.pname:focus{outline:none;border-color:var(--blue)}
.mini{position:absolute;top:8px;right:8px;font-size:18px;width:36px;height:36px;border-radius:12px;background:#eef2f6;opacity:.8}
.who{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:20px;margin:0 0 12px;color:#1e3f5e}
.mini2{font-family:inherit;font-weight:700;font-size:15px;padding:6px 12px;border-radius:12px;background:#fff;box-shadow:0 3px 0 #c7d6e3}
#bg{position:fixed;inset:0;z-index:-1}
#bg svg{width:100%;height:100%}

/* top bar */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(#5a3a22,#4a2f1b);box-shadow:0 4px 0 #2f1d10;color:#fff}
#top .logo{font-weight:700;font-size:22px;letter-spacing:.5px;margin-right:auto;white-space:nowrap;text-shadow:0 2px 0 #2f1d10}
#top .logo span{color:#ffcf4d}
.chip{display:flex;align-items:center;gap:4px;background:#fff6dd;color:#5a3a22;border-radius:999px;padding:4px 12px;font-weight:700;font-size:18px;box-shadow:inset 0 -3px 0 #e6cf98}
.ibtn{font-size:22px;width:40px;height:40px;border-radius:12px;background:#7a5235;box-shadow:inset 0 -3px 0 #4a2f1b}
@media (max-width:520px){#top .logo{font-size:0}#top .logo::before{content:'🐉';font-size:26px}.chip{font-size:16px;padding:4px 9px}}

/* main + nav */
#main{max-width:820px;margin:0 auto;padding:16px 14px 120px}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#5a3a22,#3e2716);box-shadow:0 -4px 0 #2f1d10}
#nav button{flex:1;max-width:110px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;border-radius:14px;color:#fff;font-weight:600;font-size:12px;white-space:nowrap}
#nav button .e{font-size:26px;line-height:1}
#nav button.on{background:#ffcf4d;color:#4a2f1b;box-shadow:inset 0 -4px 0 #d9a21e}

h1.title{font-size:30px;margin:4px 0 4px;text-align:center;color:#fff;text-shadow:0 3px 0 #2c5d8a,0 0 12px rgba(0,0,0,.15)}
.sub{text-align:center;font-size:18px;margin:0 0 14px;color:#1e3f5e;font-weight:500}
.speak{font-size:20px;background:#fff;border-radius:50%;width:38px;height:38px;box-shadow:0 3px 0 #b9cde0;vertical-align:middle;margin-left:6px}

.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 0 var(--edge),0 10px 24px rgba(0,0,0,.08);margin-bottom:16px}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:20px;padding:12px 22px;border-radius:18px;background:var(--orange);color:#fff;box-shadow:0 5px 0 #c85e17;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #c85e17}
.big.green{background:var(--green);box-shadow:0 5px 0 #1f7f46}
.big.blue{background:var(--blue);box-shadow:0 5px 0 #2563c9}
.big.gray{background:#b8c2cc;box-shadow:0 5px 0 #8a96a3}
.big[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* dragon cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.dcard{position:relative;background:#fff;border-radius:20px;padding:8px 8px 10px;border:4px solid var(--common);box-shadow:0 5px 0 rgba(0,0,0,.12);text-align:center}
.dcard:active{transform:scale(.97)}
.dcard .art{background:radial-gradient(circle at 50% 60%,#eaf7ff,#d3ecff);border-radius:14px}
.dname{font-weight:700;font-size:17px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta{font-size:14px;color:#5b6b80}
.fav{position:absolute;top:2px;right:6px;font-size:22px}
.r-common{border-color:var(--common)}.r-rare{border-color:var(--rare)}.r-epic{border-color:var(--epic)}.r-legendary{border-color:var(--legendary);animation:shine 2s ease-in-out infinite}
@keyframes shine{50%{box-shadow:0 5px 0 rgba(0,0,0,.12),0 0 18px #ffd34d}}
.rtag{display:inline-block;font-size:13px;font-weight:700;color:#fff;border-radius:999px;padding:2px 10px}
.bg-common{background:var(--common)}.bg-rare{background:var(--rare)}.bg-epic{background:var(--epic)}.bg-legendary{background:var(--legendary)}
.sil svg{filter:brightness(0) opacity(.22)}
.art svg{display:block;width:100%;height:auto}
.bob svg{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.flap{animation:flap 1.1s ease-in-out infinite}
@keyframes flap{50%{transform:rotate(16deg) scale(1,.9)}}

/* hero */
.hero{display:flex;gap:14px;align-items:center}
.hero .art{width:46%;max-width:300px;flex-shrink:0;cursor:pointer}
.hero .info{flex:1}
.bubble{background:#fff;border-radius:18px;padding:12px 14px;font-size:18px;position:relative;box-shadow:0 4px 0 #dfe7ef;margin-bottom:10px}
.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.tabs button{font-weight:700;font-size:18px;padding:10px 16px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #c7d6e3}
.tabs button.on{background:#ffcf4d;box-shadow:0 4px 0 #d9a21e}
@media (max-width:560px){.hero{flex-direction:column}.hero .art{width:80%}}

/* stats */
.stat{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:600}
.stat .sl{width:110px;font-size:16px}
.stat .bar{flex:1;height:16px;background:#e9eef4;border-radius:10px;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#ffb84d,#ff7a3d)}
.stat b{width:28px;text-align:right}

/* play / shop / trade cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.gcard{background:#fff;border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 0 #d6e2ec}
.gcard .icon{font-size:64px;line-height:1.1}
.gcard h3{margin:6px 0 4px;font-size:22px}
.gcard p{margin:0 0 12px;font-size:16px;color:#4f5f74}
.egg-art{width:120px;margin:0 auto;display:block}
.odds{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.odds span{font-size:12px;font-weight:700;color:#fff;border-radius:8px;padding:2px 6px}

.offer{display:flex;flex-direction:column;gap:10px}
.trader{display:flex;align-items:center;gap:10px}
.trader .face{width:70px;flex-shrink:0}
.swap{display:flex;align-items:center;justify-content:center;gap:6px}
.swap .side{width:44%;text-align:center}
.swap .side .art{background:#eef7ff;border-radius:16px;border:3px solid var(--common)}
.swap .arrow{font-size:30px}
.side small{display:block;font-weight:700;font-size:13px;color:#7a8799;text-transform:uppercase}
.coinnote{text-align:center;font-weight:700;font-size:17px}

.picker{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.pick{flex:0 0 auto;width:96px;background:#fff;border-radius:16px;padding:4px;border:3px solid transparent;box-shadow:0 4px 0 #d6e2ec;text-align:center;font-weight:600;font-size:13px}
.pick.on{border-color:#ff8a3d;background:#fff3e6}
.tbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tbtns .big{flex-direction:column;font-size:17px;padding:12px 6px;gap:2px}
.tbtns .big .e{font-size:34px}
.tier{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border-radius:18px;padding:12px;box-shadow:0 5px 0 #d6e2ec;margin-bottom:10px}
.tier .e{font-size:44px}
.tier h3{margin:0;font-size:20px}
.tier p{margin:2px 0 0;font-size:15px;color:#4f5f74}
.tier .go{margin-left:auto;font-weight:700;color:#fff;background:var(--green);border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 #1f7f46;white-space:nowrap}
.powerbox{display:inline-block;background:#fff3e0;border-radius:14px;padding:6px 12px;font-weight:700;font-size:18px}

/* modal */
#modal{position:fixed;inset:0;z-index:100;background:rgba(20,35,60,.55);display:flex;align-items:center;justify-content:center;padding:14px}
#modal.hidden{display:none}
.mbox{background:var(--card);border-radius:26px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:18px;text-align:center;box-shadow:0 8px 0 var(--edge);animation:popin .25s ease-out}
@keyframes popin{from{transform:scale(.8);opacity:0}}
.mbox h2{margin:4px 0 6px;font-size:28px}
.mbox .art{max-width:280px;margin:0 auto}
.mbox input{font-family:inherit;font-size:20px;padding:8px 12px;border-radius:12px;border:3px solid #ddd;width:60%;text-align:center}
.fact{background:#eef7ff;border-radius:16px;padding:10px 12px;font-size:17px;margin:10px 0;text-align:left}

/* games */
.game{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column}
.ghead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.85)}
.gx{font-size:22px;width:44px;height:44px;border-radius:12px;background:#ff6b6b;color:#fff;box-shadow:0 3px 0 #c94a4a}
.gtitle{font-weight:700;font-size:22px;flex:1}
.gscore{font-weight:700;font-size:22px}
.gtime{height:12px;background:rgba(255,255,255,.6)}
.gtime i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#36b36a,#ffd34d);transition:width .1s linear}
.ghint{text-align:center;font-weight:600;font-size:18px;padding:6px;background:rgba(255,255,255,.55)}
.arena{position:relative;flex:1;overflow:hidden;touch-action:none}
.gfoot{display:flex;justify-content:center;padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
.gfoot:empty{display:none}
.bg-sea{background:linear-gradient(#9fdcff 0%,#cfefff 32%,#3fb4e0 32%,#1f7fbf 100%)}
.bg-sea .arena::before{content:'';position:absolute;left:0;right:0;top:32%;height:14px;background:repeating-linear-gradient(90deg,#fff 0 20px,transparent 20px 44px);opacity:.5;border-radius:8px}
.bg-grass{background:linear-gradient(#a9e4ff 0%,#d6f3ff 18%,#8fd16c 18%,#5fae4a 100%)}
.bg-sky{background:linear-gradient(#5fb8ff,#bfe8ff)}
.bg-field{background:linear-gradient(#ffe2a8,#ffd07a 60%,#d9a85b 60%,#c48f45)}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:700;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:none;z-index:5}
.cd span{animation:cdpop .7s ease-out}
@keyframes cdpop{from{transform:scale(1.8);opacity:0}}
.fish{position:absolute;font-size:68px;line-height:1;padding:10px;cursor:pointer;will-change:transform,left,top;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.fish.gold{filter:drop-shadow(0 0 8px #ffe066) drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.gone{animation:gone .35s ease-out forwards;pointer-events:none}
@keyframes gone{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.float{position:absolute;font-weight:700;font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:floatup .9s ease-out forwards;transform:translate(-50%,-50%);z-index:6}
@keyframes floatup{to{transform:translate(-50%,-160%);opacity:0}}
.nests{position:absolute;inset:4% 4% 6%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4%}
.nest{position:relative}
.nbowl{position:absolute;left:8%;right:8%;bottom:4%;height:34%;background:radial-gradient(ellipse at 50% 20%,#4a2f1b 0 40%,#8a5a32 41% 70%,#6b4325 71%);border-radius:50%;box-shadow:0 4px 0 #3e2716}
.slot{position:absolute;z-index:1;left:0;right:0;bottom:14%;top:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.item{width:64%;max-width:100px;animation:rise .45s ease-out;cursor:pointer}
.item .emo{font-size:min(15vw,72px);display:block;text-align:center;line-height:1}
.item.hide{animation:sink .25s ease-in forwards}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes sink{to{transform:translateY(110%)}}
.item.hide{animation-duration:.5s}
.ring{position:absolute;width:86px;height:86px;border-radius:50%;border:12px solid #ffcf4d;box-shadow:0 0 0 4px #fff,inset 0 0 0 4px #fff;transform:translate(-50%,-50%);animation:grow .25s ease-out;cursor:pointer}
.target{position:absolute;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle,#e74c3c 0 18%,#fff 19% 36%,#e74c3c 37% 55%,#fff 56% 72%,#8a5a32 73%);box-shadow:0 5px 0 rgba(0,0,0,.25);transform:translate(-50%,-50%);animation:grow .25s ease-out;cursor:pointer}
@keyframes grow{from{transform:translate(-50%,-50%) scale(0)}}
.helper{position:absolute;left:2%;bottom:2%;width:28%;max-width:170px;pointer-events:none}
.helper.zoom svg{animation:zoom .35s ease-out}
@keyframes zoom{50%{transform:scale(1.15) translateX(8%)}}
.pushwrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:4%;padding-bottom:4%}
.pushwrap .art{width:40%;max-width:260px}
.boulder{font-size:min(28vw,150px);line-height:1;transition:transform .12s}
.meter{position:absolute;right:4%;top:8%;bottom:8%;width:28px;background:rgba(255,255,255,.6);border-radius:14px;overflow:hidden;border:3px solid #fff}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#ff7a3d,#ffd34d);transition:height .1s}
.tapbtn{font-size:30px;font-weight:700;color:#fff;background:#ff8a3d;border-radius:24px;padding:18px 60px;box-shadow:0 7px 0 #c85e17}
.tapbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #c85e17}
.lane{position:absolute;left:0;right:0;border-bottom:3px dashed rgba(255,255,255,.7)}
.racer{position:absolute;width:min(20vw,110px);transform:translateY(-50%);top:50%;transition:none}
.racer .tag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;padding:0 8px;font-size:12px;font-weight:700;white-space:nowrap}
.racer.me .tag{background:#ffcf4d}
.finish{position:absolute;top:0;bottom:0;right:6%;width:16px;background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 0 0/16px 16px;opacity:.8}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50%;height:140%;left:15%;top:-60%}.cloud::after{width:40%;height:120%;left:48%;top:-40%}

.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:200;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:300;background:#24324a;color:#fff;font-weight:600;font-size:18px;padding:10px 18px;border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90vw}
#toast.show{opacity:1}
.wobble{animation:wobble .4s ease-in-out}
@keyframes wobble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.reveal{animation:reveal .6s ease-out}
@keyframes reveal{from{transform:scale(.2) rotate(-20deg);opacity:0}}
.newtag{display:inline-block;background:#ff4f7b;color:#fff;font-weight:700;border-radius:10px;padding:2px 10px;margin-left:6px;font-size:15px}
/* ===== needs / care ===== */
.needs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#fff;border-radius:20px;padding:10px 8px;box-shadow:0 5px 0 #d6e2ec;margin-bottom:12px}
.need{text-align:center;font-weight:700;font-size:13px}
.need .ne{font-size:28px;line-height:1.1;display:block}
.nb{height:12px;border-radius:8px;background:#edf1f6;overflow:hidden;margin-top:4px;box-shadow:inset 0 0 0 2px #e2e8f0}
.nb i{display:block;height:100%;border-radius:8px;transition:width .4s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.need.low .ne,.mneed.low span{animation:needpulse 1s ease-in-out infinite}
@keyframes needpulse{50%{transform:scale(1.25)}}
.mneeds{display:flex;gap:8px;flex:1}
.mneed{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.mneed span{font-size:18px}
.mneed .nb{flex:1;margin:0;height:10px}
.advready{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 #d6e2ec;margin-bottom:14px;font-size:16px}
.nbadge{position:absolute;top:2px;left:6px;font-size:22px;animation:needpulse 1s ease-in-out infinite}
.care-scene{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/3;width:100%;max-width:640px;margin:0 auto;border:6px solid #6b3f1e;box-shadow:0 6px 0 #4a2a12,0 14px 30px rgba(0,0,0,.2);touch-action:none}
.cbg,.cbg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.care-dragon{position:absolute;left:50%;bottom:7%;width:60%;transform:translateX(-50%);cursor:pointer}
.care-dragon .inner{transform-origin:50% 92%}
.care-dragon svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 6px rgba(60,30,10,.25))}
.care-dragon.bounce .inner{animation:cbounce .55s ease-out}
@keyframes cbounce{30%{transform:scale(1.08,.9)}60%{transform:translateY(-12%) scale(.95,1.06)}}
.care-dragon.shake .inner{animation:cshake .5s}
@keyframes cshake{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.care-dragon.chomp .inner{animation:chomp .22s 4}
@keyframes chomp{50%{transform:scale(1.04,.95)}}
.stink path{animation:stink 1.4s ease-in-out infinite}
.stink path:nth-child(2){animation-delay:.3s}.stink path:nth-child(3){animation-delay:.6s}
@keyframes stink{50%{transform:translateY(-5px);opacity:.4}}
.sbub{position:absolute;left:50%;top:5%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 18px;font-weight:700;font-size:21px;box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap;animation:popin .25s;z-index:5}
.sbub::after{content:'';position:absolute;left:50%;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
.cfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.part{position:absolute;pointer-events:none;font-size:28px;transform:translate(-50%,-50%);animation:partup 1.1s ease-out forwards}
@keyframes partup{to{transform:translate(calc(-50% + var(--dx,0px)),calc(-50% - 80px)) scale(1.3);opacity:0}}
.cpop{font-size:22px;color:#fff;text-shadow:0 2px 0 #a86b00,0 0 6px #a86b00}
.bubble-p{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0 18%,rgba(200,240,255,.55) 40%,rgba(150,215,255,.35));border:2px solid rgba(255,255,255,.95);transform:translate(-50%,-50%);animation:bub 1.2s ease-out forwards;pointer-events:none}
@keyframes bub{to{transform:translate(-50%,-220%) scale(1.4);opacity:0}}
.sleepov{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(50,60,140,.55),rgba(10,15,50,.85));opacity:0;transition:opacity .9s;pointer-events:none;z-index:3}
.sleepov.on{opacity:1}

function backDecoSVG(sp, b) {
  if (sp.back === 'none') return '';
  const {cx, cy, rx, ry} = b, c = sp.c, dk = c.dark;
  const pts = [];
  const n = 5, a0 = 200, a1 = 290;
  for (let i = 0; i < n; i++) {
    const a = (a0 + (a1 - a0) * i / (n - 1)) * Math.PI / 180;
    const p = [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
    let nx = Math.cos(a) / rx, ny = Math.sin(a) / ry; const L = Math.hypot(nx, ny); nx /= L; ny /= L;
    pts.push({p, n: [nx, ny], s: .8 + .3 * Math.sin(Math.PI * i / (n - 1))});
  }

  const P1 = [cx + rx * .3, cy - ry * .88], H = [134, 72];
  let dx = H[0] - P1[0], dy = H[1] - P1[1]; const dl = Math.hypot(dx, dy);
  const nn = [dy / dl, -dx / dl];
  [.3, .7].forEach(t => pts.push({p: [P1[0] + dx * t, P1[1] + dy * t], n: nn, s: .7}));
  const fillFor = {spikes: c.accent, plates: mix(c.body, dk, .25), fin: c.wing, crystals: c.horn, fluff: c.belly, leaves: c.wing}[sp.back] || c.accent;
  const st = `stroke="${dk}" stroke-width="2.4" stroke-linejoin="round"`;
  let o = '';
  if (sp.back === 'fin') {
    const body = pts.slice(0, n);
    const last = body[body.length - 1];
    let d = `M${f1(body[0].p[0] - body[0].n[0] * 3)},${f1(body[0].p[1] - body[0].n[1] * 3)}`;
    for (let i = 0; i < body.length; i++) {
      const q = body[i], h = 15 * q.s, tip = [q.p[0] + q.n[0] * h, q.p[1] + q.n[1] * h];
      if (i === 0) d += ` L${f1(tip[0])},${f1(tip[1])}`;
      else {
        const pr = body[i - 1];
        const mx = (q.p[0] + pr.p[0]) / 2 + (q.n[0] + pr.n[0]) / 2 * 4, my = (q.p[1] + pr.p[1]) / 2 + (q.n[1] + pr.n[1]) / 2 * 4;
        d += ` Q${f1(mx)},${f1(my)} ${f1(tip[0])},${f1(tip[1])}`;
      }
    }
    d += ` L${f1(last.p[0] - last.n[0] * 3)},${f1(last.p[1] - last.n[1] * 3)} Z`;
    o += `<path d="${d}" fill="${fillFor}" ${st}/>`;
    pts.slice(n).forEach(q => { o += tri(q, 9, 5); });
    return o;
  }
  function tri(q, h, w) {
    const t = [-q.n[1], q.n[0]];
    const b1 = [q.p[0] - q.n[0] * 3 + t[0] * w, q.p[1] - q.n[1] * 3 + t[1] * w];
    const b2 = [q.p[0] - q.n[0] * 3 - t[0] * w, q.p[1] - q.n[1] * 3 - t[1] * w];
    const tp = [q.p[0] + q.n[0] * h, q.p[1] + q.n[1] * h];
    return `<path d="M${f1(b1[0])},${f1(b1[1])} L${f1(tp[0])},${f1(tp[1])} L${f1(b2[0])},${f1(b2[1])}Z" fill="${fillFor}" ${st}/>`;
  }
  pts.forEach(q => {
    const t = [-q.n[1], q.n[0]];
    if (sp.back === 'spikes') o += tri(q, 15 * q.s, 6);
    else if (sp.back === 'plates') {
      const w = 7, h = 13 * q.s;
      const b1 = [q.p[0] - q.n[0] * 3 + t[0] * w, q.p[1] - q.n[1] * 3 + t[1] * w];
      const b2 = [q.p[0] - q.n[0] * 3 - t[0] * w, q.p[1] - q.n[1] * 3 - t[1] * w];
      const cp = [q.p[0] + q.n[0] * h * 1.7, q.p[1] + q.n[1] * h * 1.7];
      o += `<path d="M${f1(b1[0])},${f1(b1[1])} Q${f1(cp[0])},${f1(cp[1])} ${f1(b2[0])},${f1(b2[1])}Z" fill="${fillFor}" ${st}/>`;
    } else if (sp.back === 'crystals') {
      const h = 18 * q.s, w = 4.5;
      const a = [q.p[0] - q.n[0] * 3, q.p[1] - q.n[1] * 3], tp = [q.p[0] + q.n[0] * h, q.p[1] + q.n[1] * h];
      const m = [q.p[0] + q.n[0] * h * .45, q.p[1] + q.n[1] * h * .45];
      o += `<path d="M${f1(a[0])},${f1(a[1])} L${f1(m[0] + t[0] * w)},${f1(m[1] + t[1] * w)} L${f1(tp[0])},${f1(tp[1])} L${f1(m[0] - t[0] * w)},${f1(m[1] - t[1] * w)}Z" fill="${fillFor}" opacity=".95" ${st}/>`;
    } else if (sp.back === 'fluff') {
      o += `<circle cx="${f1(q.p[0] + q.n[0] * 2)}" cy="${f1(q.p[1] + q.n[1] * 2)}" r="${f1(8 * q.s + 1)}" fill="${fillFor}" ${st}/>`;
    } else if (sp.back === 'leaves') {
      const h = 16 * q.s, w = 6;
      const a = [q.p[0] - q.n[0] * 2, q.p[1] - q.n[1] * 2], tp = [q.p[0] + q.n[0] * h, q.p[1] + q.n[1] * h];
      const m = [q.p[0] + q.n[0] * h * .5, q.p[1] + q.n[1] * h * .5];
      o += `<path d="M${f1(a[0])},${f1(a[1])} Q${f1(m[0] + t[0] * w * 1.6)},${f1(m[1] + t[1] * w * 1.6)} ${f1(tp[0])},${f1(tp[1])} Q${f1(m[0] - t[0] * w * 1.6)},${f1(m[1] - t[1] * w * 1.6)} ${f1(a[0])},${f1(a[1])}Z" fill="${fillFor}" ${st}/>`;

  }

}

function makeDragon(spId, extra = 0) {
  const sp = SP[spId];
  const d = {id: S.nextId++, sp: spId, name: sp.name,
    speed: clamp(sp.stats[0] + ri(-1, 1), 1, MAXS), strength: clamp(sp.stats[1] + ri(-1, 1), 1, MAXS), blast: clamp(sp.stats[2] + ri(-1, 1), 1, MAXS), pts: 0};
  for (let i = 0; i < extra; i++) { const k = pick(['speed', 'strength', 'blast']); if (d[k] < MAXS) { d[k]++; d.pts++; } }
  return d;
}
function addDragon(d) {
  initNeeds(d); d.nt = Date.now();
  const isNew = !S.seen.includes(d.sp);
  S.dragons.push(d);
  if (isNew) S.seen.push(d.sp);
  if (!S.fav) S.fav = d.id;
  save();
  return isNew;
}

  tap: [[330, .03]], baa: [[260, .12], [230, .18]], crack: [[200, .07], [150, .07]], hatch: [[392, .09], [523, .09], [659, .09], [784, .09], [1047, .28]], count: [[440, .12]], go: [[880, .28]], sad: [[392, .15], [330, .25]],
  jump: [[480, .06], [720, .08]], bonk: [[180, .1], [130, .14]], splash: [[320, .05], [260, .05], [200, .07]], chomp: [[230, .05], [170, .06], [230, .05]],
  slurp: [[400, .06], [520, .06], [640, .09]], lull: [[523, .3], [392, .3], [440, .3], [349, .5]], giggle: [[700, .05], [820, .05], [940, .07]]};
function sfx(n) {
  if (!S || !S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    let t = AC.currentTime;
    NOTES[n].forEach(([fr, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = fr;
      g.gain.setValueAtTime(.16, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .9;
    });
  } catch (e) {}
}
function say(text) {
  try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(text).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')); u.rate = .92; u.pitch = 1.1; speechSynthesis.speak(u); } catch (e) {}
}
function confetti(n = 70) {
  const cols = ['#ff6b6b', '#ffd34d', '#36b36a', '#3d8bfd', '#a965ff', '#ff8a3d'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = rnd(0, 100) + 'vw'; c.style.background = pick(cols);
    c.style.animationDuration = rnd(1.6, 3) + 's'; c.style.animationDelay = rnd(0, .4) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
  }
}

function genOffer(i) {
  if (!S.dragons.length) return null;
  const others = S.dragons.filter(d => d.id !== S.fav);
  const want = pick(others.length ? others : S.dragons);
  let rIdx = RORDER.indexOf(SP[want.sp].r);
  const roll = Math.random();
  if (roll < .32) rIdx++; else if (roll < .5) rIdx--;
  rIdx = clamp(rIdx, 0, 3);
  const pool = SPECIES.filter(s => s.r === RORDER[rIdx] && s.id !== want.sp);
  const unseen = pool.filter(s => !S.seen.includes(s.id));
  const sp = unseen.length && Math.random() < .6 ? pick(unseen) : pick(pool);
  const give = makeDragon(sp.id, ri(0, 5));
  let coins = (RAR[sp.r].v - RAR[SP[want.sp].r].v) * 12 + Math.round((give.pts - want.pts) * 1.5);
  coins = Math.round(coins / 5) * 5;
  return {trader: i, wantId: want.id, give, coins};
}
function ensureOffers() {
  let changed = false;
  for (let i = 0; i < 3; i++) {
    const o = S.offers[i];
    if (!o || !getD(o.wantId)) { S.offers[i] = genOffer(i); changed = true; }
  }
  if (changed) save();
}

// ---------- hatching ----------
function rollRarity(odds) { let r = Math.random(), acc = 0; for (const k of RORDER) { acc += odds[k] || 0; if (r < acc) return k; } return 'common'; }
function hatch(i) {
  const e = EGGS[i]; if (S.coins < e.price) return;
  S.coins -= e.price; save(); renderTop();
  const rar = rollRarity(e.odds);
  const pool = SPECIES.filter(s => s.r === rar), unseen = pool.filter(s => !S.seen.includes(s.id));
  const sp = unseen.length && Math.random() < .5 ? pick(unseen) : pick(pool);
  let taps = 0;
  const draw = () => openModal(`<h2>Tap the egg! ${speakBtn('Tap the egg to crack it!')}</h2><p style="font-size:18px">${3 - taps} more tap${3 - taps === 1 ? '' : 's'}</p>

    const it = {el, x0: rnd(12, 82), vx: rnd(-3, 3), dur: rnd(3.4, 4.4), peak: rnd(48, 66), t: 0, gold, flip: Math.random() < .5, gone: false};
    if (it.x0 < 30) it.vx = Math.abs(it.vx); if (it.x0 > 70) it.vx = -Math.abs(it.vx);

// ---------- race ----------
function playRace(d, tier) {
  const g = openArena(tier.e + ' ' + tier.name, 'bg-sky', 'Tap FLAP! FLAP! FLAP! to go faster!');
  const pool = SPECIES.filter(s => s.id !== d.sp);
  const racers = [{me: true, sp: SP[d.sp], name: d.name, pw: power(d)}];
  for (let i = 0; i < 3; i++) { const s = pick(pool); racers.push({me: false, sp: s, name: s.name, pw: tier.p * rnd(.8, 1.15)}); }
  racers.sort(() => Math.random() - .5);
  let clouds = '';
  for (let i = 0; i < 6; i++) clouds += `<div class="cloud" style="left:${rnd(0, 90)}%;top:${rnd(5, 90)}%;width:${rnd(60, 120)}px;height:${rnd(22, 34)}px"></div>`;
  g.arena.innerHTML = clouds + '<div class="finish"></div>' + racers.map((r, i) =>
    `<div class="lane" style="top:${i * 25}%;height:25%"><div class="racer ${r.me ? 'me' : ''}" data-i="${i}"><span class="tag">${r.me ? '⭐ ' + esc(r.name) : esc(r.name)}</span>${dragonSVG(r.sp)}</div></div>`).join('');
  racers.forEach((r, i) => { r.el = g.arena.querySelector(`.racer[data-i="${i}"]`); r.x = 0; r.n = 0; r.done = false; });
  g.foot.innerHTML = '<button class="tapbtn">FLAP! 🪽</button>';
  const btn = g.foot.querySelector('.tapbtn');
  let boost = 0, go = false, alive = true, last = 0, order = [], endT = null, t = 0;
  const me = racers.find(r => r.me);
  g.setScore('🏁'); g.setTime(1);
  g.onQuit = () => { alive = false; g.close(); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); if (!go) return; boost = Math.min(4.5, boost + 1.3); sfx('tap'); });
  function loop(now) {
    if (!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
    boost = Math.max(0, boost - 1.1 * dt);
    racers.forEach(r => {
      if (r.done) return;
      r.n = clamp(r.n + rnd(-1, 1) * dt * 2, -1, 1);
      let v = (6 + r.pw * .22) * (1 + .08 * r.n);
      if (r.me) v += boost;
      r.x += v * dt;
      if (r.x >= 100) { r.x = 100; r.done = true; order.push(r); if (r.me) sfx('good'); }
      r.el.style.left = `calc(${r.x * .84}% - 10px)`;
    });
    g.setTime(1 - me.x / 100);
    const place = racers.filter(r => r.x > me.x).length + 1;
    g.setScore(['🥇', '🥈', '🥉', '4th'][place - 1]);
    if (me.done && endT === null) endT = t;
    if (order.length === racers.length || (endT !== null && t - endT > 1.2)) {
      racers.filter(r => !r.done).sort((a, b) => b.x - a.x).forEach(r => order.push(r));
      alive = false; setTimeout(() => { g.close(); raceResult(d, tier, order.indexOf(me) + 1); }, 400); return;
    }
    requestAnimationFrame(loop);
  }
  countdown(g, () => { go = true; last = performance.now(); requestAnimationFrame(loop); });
}
function raceResult(d, tier, place) {
  const mult = [1, .5, .25, .1][place - 1];
  const prize = Math.max(3, Math.round(tier.prize * mult));
  S.coins += prize; if (place === 1) S.trophies++; save(); renderTop();
  if (place === 1) { sfx('win'); confetti(120); } else if (place <= 3) sfx('good'); else sfx('sad');
  const msg = ['You WON!', '2nd place!', '3rd place!', 'Good try!'][place - 1];
  resultModal(`<div style="font-size:80px">${['🥇', '🥈', '🥉', '🎗️'][place - 1]}</div><h2>${msg}</h2><div class="art bob" style="max-width:200px">${dragonSVG(SP[d.sp])}</div>
    <p style="font-size:22px">You earned 🪙 <b>${prize}</b>${place === 1 ? ' and a 🏆 trophy!' : ''}</p>${place > 1 ? '<p style="font-size:17px">Tip: train your dragon to get more power! 💪</p>' : ''}`);

// ---------- dragon care: needs & moods ----------
// ============================================================
const NEEDS = [
  {k: 'food', e: '🍖', n: 'Food', col: '#ff8a3d', msg: 'is hungry!'},
  {k: 'water', e: '💧', n: 'Water', col: '#3d9bff', msg: 'is thirsty!'},

  {k: 'happy', e: '💗', n: 'Happy', col: '#ff5c8a', msg: 'wants to play!'},
  {k: 'energy', e: '⚡', n: 'Energy', col: '#ffb300', msg: 'is sleepy!'}

const NEEDK = Object.fromEntries(NEEDS.map(x => [x.k, x]));
const DECAY = {food: -5, water: -7, clean: -3, happy: -4, energy: 12}; // per real hour
function initNeeds(d) { if (!d.nd) d.nd = {food: 80, water: 80, clean: 95, happy: 80, energy: 100}; if (!d.nt) d.nt = Date.now(); }
function tick(d) {
  initNeeds(d);
  const h = (Date.now() - d.nt) / 3.6e6; if (h < .005) return;
  for (const k in DECAY) d.nd[k] = clamp(d.nd[k] + DECAY[k] * h, 5, 100);
  d.nt = Date.now();
}
function tickAll() { if (!S) return; S.dragons.forEach(tick); save(); }
function neediest(d) {
  if (!d.nd) return null; let best = null;
  NEEDS.forEach(x => { if (d.nd[x.k] < 35 && (!best || d.nd[x.k] < d.nd[best.k])) best = x; });
  return best;
}
function moodOf(d) {
  const n = d.nd; if (!n) return 'happy';
  if (Math.min(n.food, n.water, n.happy) < 25) return 'sad';
  if ((n.food + n.water + n.happy + n.energy) / 4 < 55 || n.energy < 20) return 'ok';
  return 'happy';
}
const dirtOf = d => d.nd ? clamp((65 - d.nd.clean) / 50, 0, 1) : 0;
const dOpts = d => ({mood: moodOf(d), dirt: dirtOf(d)});
const bumpN = (d, k, v) => { d.nd[k] = clamp(d.nd[k] + v, 0, 100); };

function mudSVG(b, clipId, dirt) {
  if (dirt < .05) return '';
  const {cx, cy, rx, ry} = b, op = f1(Math.min(.95, .25 + dirt * .75));
  const blob = (x, y, r) => `<path d="M${f1(x - r)},${f1(y)} q${f1(r * .3)},${f1(-r)} ${f1(r)},${f1(-r * .8)} q${f1(r * .9)},${f1(r * .1)} ${f1(r)},${f1(r * .9)} q${f1(-r * .2)},${f1(r * .9)} ${f1(-r)},${f1(r * .7)} q${f1(-r * .9)},${f1(-r * .1)} ${f1(-r)},${f1(-r * .8)}Z" fill="#8a5a2b"/>`;
  const n = dirt > .6 ? 7 : dirt > .3 ? 5 : 3;
  const spots = [[cx - rx * .5, cy - ry * .1, 9], [cx + rx * .25, cy + ry * .25, 7.5], [cx - rx * .1, cy - ry * .55, 6], [cx + rx * .55, cy - ry * .35, 5], [cx - rx * .78, cy + ry * .3, 6.5], [cx + rx * .05, cy + ry * .7, 6], [cx - rx * .35, cy + ry * .55, 5]];
  let o = `<g clip-path="url(#${clipId})" opacity="${op}">${spots.slice(0, n).map(s => blob(...s)).join('')}</g>`;
  if (dirt > .3) o += `<g opacity="${op}">${blob(141, 76, 5)}${dirt > .6 ? blob(172, 68, 3.5) : ''}</g>`;
  return o;
}

const careOpts = d => ({mood: sleeping ? 'sleep' : careMood || moodOf(d), dirt: dirtOf(d)});

   <div class="tray">${Object.entries(ITEMS).map(([k, it]) => `<button class="titem ${k === 'fish' && S.fish < 1 ? 'off' : ''}" data-k="${k}" aria-label="${it.n}"><span class="te">${it.e}</span><span class="tl">${k === 'fish' ? 'Fish ×' + S.fish : it.n}</span></button>`).join('')}</div>`;

function refreshCareDragon() { const d = getD(careSel), el = $('#careDragon .inner'); if (d && el) el.innerHTML = dragonSVG(SP[d.sp], careOpts(d)); }

function setMood(m, ms) { careMood = m; refreshCareDragon(); clearTimeout(careMoodT); careMoodT = setTimeout(() => { careMood = null; refreshCareDragon(); }, ms); }
function dAnim(cls) { const el = $('#careDragon'); if (!el) return; el.classList.remove('bounce', 'shake', 'chomp'); void el.offsetWidth; el.classList.add(cls); }
function cpart(x, y, html, cls = 'part', dx = 0) {

function sbub(text) {

}
function dRect() { const el = $('#careDragon'); return el ? el.getBoundingClientRect() : null; }
function mouthPt() { const r = dRect(); return [r.left + 193 / 214 * r.width, r.top + 88 / 180 * r.height]; }
function overDragon(x, y, pad = 0) { const r = dRect(); return r && x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad; }
function moveGhost(g, x, y) { g.style.left = x + 'px'; g.style.top = y + 'px'; }
function sparkleAround() { const r = dRect(); if (!r) return; for (let i = 0; i < 8; i++) setTimeout(() => cpart(r.left + rnd(.1, .9) * r.width, r.top + rnd(.15, .8) * r.height, '✨', 'part', rnd(-30, 30)), i * 90); }
function coinPop(n) { const r = dRect(); if (r) cpart(r.left + r.width * .5, r.top + r.height * .1, `<b class="cpop">+${n} 🪙</b>`); renderTop(); }

function careDown(e, k, src) {
  e.preventDefault(); if (sleeping || drag) return;
  if (k === 'nap') { doNap(); return; }
  if (k === 'fish' && S.fish < 1) { toast('No fish! Catch some in Games 🐟 — or try an apple 🍎'); sfx('sad'); return; }
  const d = getD(careSel); if (!d) return;
  const g = document.createElement('div'); g.className = 'ghost'; g.textContent = ITEMS[k].e; document.body.appendChild(g);
  const sr = src.getBoundingClientRect();
  drag = {k, it: ITEMS[k], g, moved: 0, acc: 0, lx: e.clientX, ly: e.clientY, home: [sr.left + sr.width / 2, sr.top + sr.height / 2]};
  rubStart = d.nd[ITEMS[k].need];
  moveGhost(g, e.clientX, e.clientY);
  window.addEventListener('pointermove', careMove); window.addEventListener('pointerup', careUp); window.addEventListener('pointercancel', careUp);
}
function careMove(e) {
  if (!drag) return;
  const dist = Math.hypot(e.clientX - drag.lx, e.clientY - drag.ly);
  drag.moved += dist; drag.lx = e.clientX; drag.ly = e.clientY; moveGhost(drag.g, e.clientX, e.clientY);
  if (drag.it.type === 'rub' && overDragon(e.clientX, e.clientY)) { drag.acc += dist; while (drag.acc > 26) { drag.acc -= 26; rubTick(drag.k, e.clientX, e.clientY); } }
}
function careUp(e) {
  window.removeEventListener('pointermove', careMove); window.removeEventListener('pointerup', careUp); window.removeEventListener('pointercancel', careUp);
  const dd = drag; drag = null; if (!dd) return;
  if (dd.moved < 12) { // a tap: do it for them
    moveGhost(dd.g, dd.home[0], dd.home[1]); void dd.g.offsetWidth;
    if (dd.it.type === 'drop') flyTo(dd.g, ...mouthPt(), () => applyDrop(dd.k, dd.g)); else autoRub(dd);
    return;
  }
  if (dd.it.type === 'drop') {
    if (overDragon(e.clientX, e.clientY, 30)) flyTo(dd.g, ...mouthPt(), () => applyDrop(dd.k, dd.g));
    else flyTo(dd.g, dd.home[0], dd.home[1], () => dd.g.remove(), true);
  } else { dd.g.remove(); rubEnd(); }
}
function flyTo(g, x, y, cb, fade) {
  g.classList.add('fly');
  requestAnimationFrame(() => { moveGhost(g, x, y); g.style.transform = 'translate(-50%,-50%) scale(.7)'; if (fade) g.style.opacity = '0'; });
  setTimeout(cb, 470);
}
function applyDrop(k, g) {
  const d = getD(careSel), it = ITEMS[k];
  if (!d || !$('#careDragon')) { g.remove(); return; }
  if (d.nd[it.need] >= 97) { g.remove(); sbub(FULL[it.need]); dAnim('shake'); sfx('pop'); return; }
  const before = d.nd[it.need];
  if (k === 'fish') { S.fish--; bumpN(d, 'happy', 4); }
  if (k === 'ball') bumpN(d, 'energy', -4);
  bumpN(d, it.need, it.amt);
  const [mx, my] = mouthPt();
  if (k === 'ball') {
    g.classList.remove('fly'); g.style.transform = '';
    g.animate([{transform: 'translate(-50%,-50%)'}, {transform: 'translate(-50%,-260%) rotate(200deg)'}, {transform: 'translate(-50%,-50%) rotate(360deg)'}, {transform: 'translate(-50%,-160%) rotate(480deg)'}, {transform: 'translate(-50%,-50%) rotate(560deg) scale(.6)', opacity: 0}], {duration: 1300, easing: 'ease-in-out'}).onfinish = () => g.remove();
    setMood('love', 1300); dAnim('bounce'); setTimeout(() => dAnim('bounce'), 600);
    for (let i = 0; i < 5; i++) setTimeout(() => cpart(mx + rnd(-80, 10), my + rnd(-60, 20), pick(['⭐', '✨', '💗']), 'part', rnd(-40, 40)), i * 150);
  } else {
    g.remove(); setMood('eat', 900); dAnim('chomp');
    const bits = k === 'water' ? ['💦', '💧'] : k === 'apple' ? ['🍎', '✨'] : ['✨', '💛'];
    for (let i = 0; i < 6; i++) setTimeout(() => cpart(mx + rnd(-16, 16), my + rnd(-8, 10), pick(bits), 'part', rnd(-40, 40)), i * 70);
    setTimeout(() => setMood('love', 800), 900);
  }
  sfx(it.snd); sbub(pick(it.say));
  if (before < 60) { S.coins += 1; coinPop(1); }
  save(); updateCareUI();
}
function rubTick(k, x, y) {
  const d = getD(careSel); if (!d) return;
  const need = ITEMS[k].need, before = d.nd[need];
  if (k === 'sponge') {
    bumpN(d, 'clean', 5);
    for (let i = 0; i < 2; i++) { const p = cpart(x + rnd(-22, 22), y + rnd(-14, 14), '', 'bubble-p'); if (p) { const s = rnd(10, 24); p.style.width = p.style.height = s + 'px'; } }
    if (Math.random() < .35) sfx('pop');
  } else {
    bumpN(d, 'happy', 3.5); careMood = 'love';
    cpart(x + rnd(-14, 14), y - 10, pick(['💗', '💖', '💕']), 'part', rnd(-30, 30));
    if (Math.random() < .3) sfx('giggle');
  }
  if (before < 100 && d.nd[need] >= 100) {
    if (k === 'sponge') { sbub('Squeaky clean! ✨'); sfx('good'); sparkleAround(); } else { sbub('I love you! 💗'); dAnim('bounce'); }
    if (rubStart < 60) { S.coins += 2; coinPop(2); }
  }
  save(); updateCareUI();
}
function rubEnd() { clearTimeout(careMoodT); careMoodT = setTimeout(() => { careMood = null; refreshCareDragon(); }, 500); }
function autoRub(dd) {
  const r = dRect(); if (!r) { dd.g.remove(); return; }
  const cx = r.left + r.width * .45, cy = r.top + r.height * .55, t0 = performance.now(); let lastT = 0;
  const step = now => {
    const t = (now - t0) / 1000;
    if (t > 1.7 || !$('#careDragon')) { dd.g.remove(); rubEnd(); return; }
    const x = cx + Math.cos(t * 7) * r.width * .22, y = cy + Math.sin(t * 7) * r.height * .14;
    moveGhost(dd.g, x, y); if (t - lastT > .11) { lastT = t; rubTick(dd.k, x, y); }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function petTap(e) {
  const d = getD(careSel); if (!d) return;
  bumpN(d, 'happy', 3); setMood('love', 1000); dAnim('bounce'); sfx('giggle');
  for (let i = 0; i < 3; i++) cpart(e.clientX + rnd(-20, 20), e.clientY - 10, pick(['💗', '💖', '💕']), 'part', rnd(-30, 30));
  sbub(pick(['Hee hee!', 'That tickles!', 'Hi friend!', 'Rawr! 💗'])); save(); updateCareUI();
}
function doNap() {
  const d = getD(careSel); if (!d || sleeping) return;

function genLevel(w) {
  const L = []; let x = 520;
  while (x < w.len - 420) {
    const r = Math.random();
    if (r < .32) {
      const o = pick(w.obs), O = OBS[o]; L.push({t: 'obs', o, x, w: O.w, h: O.h});
      const cx = x + O.w / 2;
      for (let i = 0; i < 5; i++) { const a = i / 4; L.push({t: 'coin', x: cx - 80 + a * 160, y: GROUND - 58 - Math.sin(Math.PI * a) * (O.h + 50)}); }
      x += O.w + rnd(260, 360);
    } else if (r < .52) {
      const n = ri(4, 6); for (let i = 0; i < n; i++) L.push({t: 'coin', x: x + i * 42, y: GROUND - 34}); x += n * 42 + rnd(170, 240);
    } else if (r < .63) {
      L.push({t: 'gem', x, y: GROUND - 150}); L.push({t: 'coin', x: x - 46, y: GROUND - 104}); L.push({t: 'coin', x: x + 46, y: GROUND - 104}); x += rnd(240, 320);
    } else if (r < .74) { L.push({t: 'puddle', x, w: 90, h: 14}); x += rnd(230, 300); }
    else if (r < .86) { L.push({t: 'sheep', x, y: GROUND - 24}); x += rnd(210, 280); }
    else { L.push({t: 'fish', x, y: GROUND - 115}); x += rnd(210, 280); }
  }
  if (Math.random() < .45) L.push({t: 'egg', x: rnd(.4, .8) * w.len, y: GROUND - 165});

}

    else { const s = rnd(3, 7); e.style.cssText += `width:${s}px;height:${s}px;border-radius:50%;background:${pick(['#ffb347', '#ff7a2a', '#ffd34d'])};box-shadow:0 0 8px #ff8a2a;left:${rnd(0, SW)}px;top:400px`; dur = rnd(3000, 5000);
      kf = [{transform: 'translate(0,0)', opacity: 1}, {transform: `translate(${f1(rnd(-40, 40))}px,-250px)`, opacity: .8}, {transform: `translate(${f1(rnd(-80, 80))}px,-420px)`, opacity: 0}]; }
    e.animate(kf, {duration: dur, easing: 'linear'}).onfinish = () => e.remove();
  }
  const ambRate = {butterfly: 2.6, leaf: .7, snow: .12, ember: .22}[w.amb];

  function reachEnd() {
    done = true; spd = 0; mood = 'love'; drawD();
    setTimeout(() => { if (!alive) return; chest.classList.add('open'); sfx('hatch');
      for (let i = 0; i < 12; i++) { const p = document.createElement('div'); p.className = 'wi'; p.style.cssText = `left:${w.len + 40}px;top:${GROUND - 40}px;width:24px`; p.innerHTML = COIN; world.appendChild(p);
        p.animate([{transform: 'translate(-50%,-50%)'}, {transform: `translate(calc(-50% + ${f1(rnd(-90, 60))}px), calc(-50% - ${f1(rnd(90, 160))}px))`, offset: .45}, {transform: `translate(calc(-50% + ${f1(rnd(-140, 80))}px), calc(-50% + 30px))`, opacity: 0}], {duration: 1100, delay: i * 40, easing: 'ease-out', fill: 'both'}).onfinish = () => p.remove(); }
      confetti(80); }, 350);
    setTimeout(() => { cleanup(); results(true); }, 2200);
  }
  function step(dt) {
    t += dt;
    if (stun > 0) { stun -= dt; spd = 0; if (stun <= 0) { vy = JV; air = true; jumps = 2; } }
    else if (!done) spd = Math.min(MAXSPD, spd + MAXSPD * 2.2 * dt);
    cam += spd * dt;
    if (air) {
      let g = G; vy -= g * dt;
      if (holding && vy < -140) vy = -140; // float gently down
      dy += vy * dt;
      if (dy <= 0) { dy = 0; vy = 0; air = false; jumps = 0; puff(4); }
    }
    const feet = GROUND - dy, x1 = cam + DX + 35, x2 = cam + DX + 95, top = feet - 70;
    for (const it of items) {
      if (it.got || it.hit || it.x > cam + SW + 120 || it.x < cam - 200) continue;
      if (it.t === 'obs') { if (x2 > it.x + 10 && x1 < it.x + it.w - 10 && feet > GROUND - it.h + 12) bonk(it); }
      else if (it.t === 'puddle') { const c = cam + DX + 65; if (dy < 2 && c > it.x + 8 && c < it.x + 82) splash(it); }
      else { const r = 20; if (it.x > x1 - r && it.x < x2 + r && it.y > top - r && it.y < feet + r) collect(it); }
    }
    if (!done && cam + DX + 95 >= w.len - 6) reachEnd();
    // draw
    world.style.transform = `translateX(${f1(-cam)}px)`;
    layers.forEach(l => { const off = (cam * l.f + (l.drift ? t * 10 : 0)) % 800; l.i.style.transform = `translateX(${f1(-off)}px)`; });
    const tilt = air ? clamp(-vy / 45, -10, 12) : 0;
    dEl.style.transform = `translate(${DX}px, ${f1(feet - FEET)}px) rotate(${f1(tilt)}deg)`;
    dEl.classList.toggle('air', air); dEl.classList.toggle('idle', spd < 5 && !air);
    const ss = 1 - Math.min(dy, 160) / 260;
    shadow.style.transform = `translate(${DX + 25}px,0) scale(${f1(ss)})`; shadow.style.opacity = f1(.25 * ss + .05);
    const p = clamp(cam / (w.len - DX - 95), 0, 1);
    box.querySelector('.prog i').style.width = (p * 100) + '%'; box.querySelector('.prog .me').style.left = (p * 100) + '%';
    dustT -= dt; if (!air && spd > 60 && dustT <= 0) { dustT = .24; puff(1); }
    ambT -= dt; if (ambT <= 0) { ambT = ambRate * rnd(.7, 1.3); spawnAmb(); }
  }
  function loop(now) { if (!alive) return; const dt = Math.min(.05, (now - last) / 1000); last = now; step(dt); requestAnimationFrame(loop); }

  const down = e => { if (e.target.closest('.gx')) return; e.preventDefault(); holding = true; jump(); };
  const up = () => { holding = false; };
  const kd = e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) jump(); holding = true; } };
  const ku = e => { if (e.code === 'Space' || e.code === 'ArrowUp') holding = false; };
  box.addEventListener('pointerdown', down); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  window.addEventListener('keydown', kd); window.addEventListener('keyup', ku); window.addEventListener('resize', layout);
  function cleanup() {
    alive = false; box.remove();
    window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    window.removeEventListener('keydown', kd); window.removeEventListener('keyup', ku); window.removeEventListener('resize', layout);
  }
  box.querySelector('.gx').onclick = () => { if (done) return; cleanup(); results(false); };

  function results(finished) {
    let coins = got.coins + got.gems * 5 + got.sheep * 3 + got.eggs * 15 + (finished ? w.chest : 0);
    if (finished && happyBonus) coins = Math.round(coins * 1.5);
    S.coins += coins; S.fish += got.fish;
    const before = S.advDone;
    if (finished) { S.advDone++; bumpN(d, 'energy', -25); bumpN(d, 'food', -15); bumpN(d, 'water', -15); bumpN(d, 'happy', 12); }
    else bumpN(d, 'energy', -8);
    bumpN(d, 'clean', -(finished ? 10 : 0) - mud * 15); d.nt = Date.now();
    save(); renderTop();
    const unlocked = WORLDS.find(x => x.need > before && x.need <= S.advDone);
    const wild = finished ? wildFor(w) : null;
    const row = (e, n, v, note = '') => v ? `<div class="lrow"><span>${e} ${n}</span><b>${v}${note}</b></div>` : '';
    if (finished) { sfx('win'); say('Adventure complete!'); }
    openModal(`<h2>${finished ? 'Adventure complete! 🎉' : 'Back home! 🏠'}</h2>
      <div class="art bob" style="max-width:220px;margin:0 auto">${dragonSVG(sp, {mood: 'love', dirt: dirtOf(d)})}</div>
      <div class="loot">${row('🪙', 'Coins', got.coins)}${row('💎', 'Gems', got.gems, ' × 5')}${row('🐑', 'Sheep', got.sheep, ' × 3')}${row('🥚', 'Golden eggs', got.eggs, ' × 15')}${row('🐟', 'Fish', got.fish)}${finished ? row('🧰', 'Treasure chest', '+' + w.chest) : ''}</div>
      ${finished && happyBonus ? '<div class="fact">💗 Happy dragon bonus! Coins × 1.5</div>' : ''}
      <p style="font-size:24px;margin:8px 0"><b>You got 🪙 ${coins}${got.fish ? ' and 🐟 ' + got.fish : ''}!</b></p>
      ${unlocked ? `<div class="fact">🗺️ New place unlocked: <b>${unlocked.e} ${unlocked.name}</b>!</div>` : ''}
      ${mud ? `<p style="font-size:17px">${esc(d.name)} got muddy! Give it a bath in Care 🧽</p>` : ''}
      <div class="row">${wild ? `<button class="big" data-act="wildPeek" data-arg="${wild.id}">👀 Someone is peeking…</button>` : '<button class="big green" data-act="closeR">Yay!</button>'}</div>`);
  }
  requestAnimationFrame(now => { last = now; requestAnimationFrame(loop); });
}
function wildPeek(spId) {
  const sp = SP[spId]; if (!sp) return; const isNew = !S.seen.includes(spId);
  sfx('hatch'); confetti(60);
  openModal(`<h2>A wild dragon! ${isNew ? '<span class="newtag">NEW!</span>' : ''}</h2><div class="art bob reveal">${dragonSVG(sp, {mood: 'love'})}</div>
    <h2>${sp.name}</h2><div>${rtag(sp.r)} ${EL[sp.el].e} ${EL[sp.el].n}</div>
    <p style="font-size:20px">${sp.name} wants to come home with you!</p>
    <div class="row"><button class="big green" data-act="wildYes" data-arg="${spId}">💗 Yes, join me!</button><button class="big gray" data-act="closeR">Bye bye! 👋</button></div>`);
  say(`A wild ${sp.name} wants to join you!`);
}


// ---------- save codes (move a game to another device) ----------
function codeHash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; return h.toString(36); }
function makeCode() {
  save();
  const b = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  return 'DF1-' + codeHash(b) + '-' + b;
}
function parseCode(raw) {
  const m = String(raw || '').replace(/\s+/g, '').match(/DF1-([0-9a-z]+)-([A-Za-z0-9+/=]+)/);
  if (!m || codeHash(m[2]) !== m[1]) return null;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(m[2]))));
    if (!o || !Array.isArray(o.dragons)) return null;
    const d = Object.assign(fresh(), o), num = (v, a, b, def = 0) => clamp(Math.floor(+v || def), a, b);
    d.dragons = d.dragons.filter(x => x && SP[x.sp]).map(x => {
      const n = {id: num(x.id, 1, 1e9, 1), sp: x.sp, name: String(x.name || SP[x.sp].name).slice(0, 14),
        speed: num(x.speed, 1, MAXS, 1), strength: num(x.strength, 1, MAXS, 1), blast: num(x.blast, 1, MAXS, 1), pts: num(x.pts, 0, 999)};
      if (x.nd && NEEDS.every(q => isFinite(+x.nd[q.k]))) { n.nd = {}; NEEDS.forEach(q => n.nd[q.k] = clamp(+x.nd[q.k], 0, 100)); n.nt = Date.now(); }
      return n;
    });
    d.coins = num(d.coins, 0, 1e7); d.fish = num(d.fish, 0, 1e5); d.trophies = num(d.trophies, 0, 1e5); d.advDone = num(d.advDone, 0, WORLDS.length * 2);
    d.seen = (Array.isArray(d.seen) ? d.seen : []).filter(x => SP[x]); d.dragons.forEach(x => { if (!d.seen.includes(x.sp)) d.seen.push(x.sp); });
    d.offers = []; d.pname = String(d.pname || 'Player').slice(0, 12); d.sound = d.sound !== false;
    if (!d.dragons.some(x => x.id === d.fav)) d.fav = d.dragons[0] ? d.dragons[0].id : null;
    d.nextId = Math.max(num(d.nextId, 1, 1e9, 1), ...d.dragons.map(x => x.id + 1), 1);
    d.started = d.started && d.dragons.length > 0;
    return d;
  } catch (e) { return null; }
}
let pendingCode = null;
function showCodeModal() {
  const c = makeCode();
  openModal(`<h2>📋 Save code</h2><p style="font-size:17px">This code holds <b>${esc(S.pname)}'s</b> whole game. Copy it, then on another device tap <b>"Use a save code"</b> on the Who's-playing screen and paste it.</p>
    <textarea class="codebox" id="codeOut" readonly aria-label="Save code">${c}</textarea>
    <div class="row"><button class="big blue" data-act="copyCode">📋 Copy code</button><button class="big green" data-act="close">Done</button></div>`);
}
function showImportModal() {
  const nm = i => { const d = readSlot(i); return d ? 'replace ' + esc(d.pname || 'Player ' + (i + 1)) : 'new player'; };
  openModal(`<h2>📥 Use a save code</h2><p style="font-size:17px">Paste the code from the other device:</p>
    <textarea class="codebox" id="codeIn" placeholder="DF1-…" aria-label="Paste save code"></textarea>
    <p style="font-size:16px;margin:4px 0 8px">Put it in:</p>
    <div class="row"><button class="big" data-act="importGo" data-arg="0">Player 1 <small>(${nm(0)})</small></button><button class="big blue" data-act="importGo" data-arg="1">Player 2 <small>(${nm(1)})</small></button></div>
    <div class="row" style="margin-top:10px"><button class="big gray" data-act="close">Cancel</button></div>`);
}
function doImport(i, d) {
  try { localStorage.setItem(SLOT_KEYS[i], JSON.stringify(d)); } catch (e) { toast("Couldn't save here 😕"); return; }
  closeModal(); sfx('win'); confetti(); say('Welcome back, ' + d.pname + '!'); enterProfile(i, readSlot(i));
}

// ---------- actions ----------
const ACT = {
  tab: a => { if (a === 'train' || a === 'race') { arenaView = a; a = 'arena'; } tab = a; render(); },
  arenaView: a => { arenaView = a; render(); },
  careSel: a => { careSel = +a; careMood = null; render(); },
  careFor: a => { careSel = +a; tab = 'care'; render(); },
  advSel: a => { advSel = +a; render(); },
  advFor: a => { advSel = +a; tab = 'adventure'; render(); },
  advGo: a => advGo(+a),
  goCare: a => { closeModal(); careSel = +a; tab = 'care'; render(); },
  wildPeek: a => wildPeek(a),
  wildYes: a => { if (!SP[a]) return; const d = makeDragon(a); const isNew = addDragon(d); closeModal(); sfx('win'); confetti(); toast(`${d.name} joined your team! ${isNew ? '📖 New in your Dragon Book!' : ''}`); say(`${d.name} joined your team!`); render(); },
  speak: a => say(a),
  sound: () => { if (!S) return; S.sound = !S.sound; save(); renderTop(); if (S.sound) sfx('pop'); },
  settings: () => !S ? null : openModal(`<h2>⚙️ Settings</h2><p style="font-size:17px">Playing as <b>${esc(S.pname)}</b>. Your game saves in this browser.</p>
      <div style="margin-bottom:12px"><input class="pname" id="rnm" maxlength="12" value="${esc(S.pname)}" aria-label="Your name" style="width:55%;margin:0 6px 0 0"><button class="big blue" style="padding:8px 14px;font-size:17px" data-act="renameMe">✏️ Name</button></div>
      <div class="row"><button class="big" data-act="switchPlayer">🔄 Switch player</button><button class="big blue" data-act="showCode">📋 Save code</button><button class="big blue" data-act="sound">${S.sound ? '🔇 Sound off' : '🔊 Sound on'}</button>
      <button class="big gray" data-act="reset1">Start over</button><button class="big green" data-act="close">Close</button></div>`),
  reset1: () => openModal(`<h2>Start over?</h2><p style="font-size:18px">All dragons, coins and trophies will be gone. Ask a grown-up first!</p>
      <div class="row"><button class="big" data-act="reset2">Yes, start over</button><button class="big green" data-act="close">No, keep my game</button></div>`),
  reset2: () => { const n = S.pname; S = fresh(); S.pname = n; save(); closeModal(); tab = 'home'; trainSel = raceSel = careSel = advSel = null; render(); },
  showCode: () => { if (S) showCodeModal(); },
  showImport: () => showImportModal(),
  copyCode: () => { const t = $('#codeOut'); if (!t) return; t.focus(); t.select(); t.setSelectionRange(0, 1e6);
    const ok = () => { toast('Copied! 📋'); sfx('good'); };
    try { if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t.value).then(ok, () => { document.execCommand('copy') ? ok() : toast('Press and hold to copy 👆'); }); return; } } catch (e) {}
    try { document.execCommand('copy') ? ok() : toast('Press and hold to copy 👆'); } catch (e) { toast('Press and hold to copy 👆'); } },
  importGo: a => { const i = +a, d = parseCode($('#codeIn') && $('#codeIn').value);
    if (!d) { toast("That code doesn't look right 😕 Copy the whole thing!"); sfx('sad'); return; }
    if (readSlot(i)) { pendingCode = d; const o = readSlot(i);
      openModal(`<h2>Replace ${esc(o.pname || 'Player ' + (i + 1))}?</h2><p style="font-size:18px">Their current game will be swapped for <b>${esc(d.pname)}</b>'s game (🐉 ${d.dragons.length} · 🪙 ${d.coins}). Ask a grown-up first!</p>
        <div class="row"><button class="big" data-act="importYes" data-arg="${i}">Yes, replace</button><button class="big green" data-act="close">No, keep it</button></div>`); return; }
    doImport(i, d); },
  importYes: a => { if (pendingCode) { const d = pendingCode; pendingCode = null; doImport(+a, d); } },
  newProfile: a => { const i = +a, nm = ($('#pn' + i).value || '').trim().slice(0, 12); if (!nm) { const el = $('#pn' + i); el.focus(); el.classList.add('wobble'); toast('Type your name first! ✏️'); sfx('sad'); return; }
    const d = fresh(); d.pname = nm; enterProfile(i, d); save(); sfx('good'); },
  pickProfile: a => { const d = readSlot(+a); if (d) { enterProfile(+a, d); sfx('good'); } },
  switchPlayer: () => { save(); S = null; slot = null; closeModal(); sfx('pop'); render(); },
  renameMe: () => { const v = ($('#rnm').value || '').trim().slice(0, 12); if (v) { S.pname = v; save(); toast('Hi, ' + v + '! 👋'); closeModal(); render(); } },
  eraseAsk: a => { const d = readSlot(+a); if (!d) return; openModal(`<h2>Erase ${esc(d.pname || 'Player ' + (+a + 1))}?</h2><p style="font-size:18px">All of their dragons, coins and trophies will be gone for good. Ask a grown-up first!</p>
      <div class="row"><button class="big" data-act="eraseYes" data-arg="${a}">Yes, erase</button><button class="big green" data-act="close">No, keep it</button></div>`); },
  eraseYes: a => { try { localStorage.removeItem(SLOT_KEYS[+a]); } catch (e) {} closeModal(); render(); },
  close: () => { closeModal(); render(); },
  closeR: () => { closeModal(); render(); },
  starter: a => { const d = makeDragon(a); addDragon(d); S.started = true; save(); sfx('hatch'); confetti(); tab = 'home'; render(); toast(`${d.name} is your new dragon! 🐉`); say(`${d.name} is your new dragon!`); },
  homeView: a => { homeView = a; render(); },
  detail: a => detailModal(a),
  book: a => bookModal(a),
  fav: a => { S.fav = +a; save(); sfx('good'); detailModal(a); render(); },
  rename: a => { const d = getD(a), v = ($('#rn').value || '').trim().slice(0, 14); if (d && v) { d.name = v; save(); sfx('good'); toast('New name: ' + v); detailModal(a); render(); } },
  game: a => { closeModal(); a === 'fish' ? playFish() : playEggs(); },
  buyEgg: a => hatch(+a),
  buyFish: () => { if (S.coins < 10) return; S.coins -= 10; S.fish += 5; save(); sfx('coin'); toast('+5 fish 🐟'); render(); },
  tradeGo: a => {
    const o = S.offers[+a], want = getD(o.wantId), gsp = SP[o.give.sp];
    openModal(`<h2>Trade?</h2><div class="swap"><div class="side"><div class="art">${dragonSVG(SP[want.sp])}</div><b>${esc(want.name)}</b></div><div class="arrow">➡️</div>
      <div class="side"><div class="art">${dragonSVG(gsp)}</div><b>${gsp.name}</b></div></div>
      <p style="font-size:18px">${esc(want.name)} will go live with ${TRADERS[o.trader].name}.${o.coins > 0 ? ` You pay 🪙 ${o.coins}.` : o.coins < 0 ? ` You get 🪙 ${-o.coins}!` : ''}</p>
      <div class="row"><button class="big green" data-act="tradeYes" data-arg="${a}">Yes, trade!</button><button class="big gray" data-act="close">Wait, no</button></div>`);
  },
  tradeYes: a => {
    const i = +a, o = S.offers[i], want = getD(o.wantId);
    if (!want || o.coins > S.coins) { closeModal(); render(); return; }
    S.coins -= o.coins;
    S.dragons = S.dragons.filter(d => d.id !== want.id);
    const g = o.give; g.id = S.nextId++;
    const isNew = addDragon(g);
    if (S.fav === want.id) S.fav = g.id;
    S.offers[i] = null; save();
    sfx('win'); confetti();
    const gsp = SP[g.sp];
    openModal(`<h2>Trade done! ${isNew ? '<span class="newtag">NEW!</span>' : ''}</h2><div class="art bob reveal">${dragonSVG(gsp)}</div><h2>${gsp.name}</h2>
      <div>${rtag(gsp.r)} ${EL[gsp.el].e} ${EL[gsp.el].n} · Level ${level(g)}</div><div class="fact">💡 ${gsp.fact}</div>
      <div class="row"><button class="big green" data-act="closeR">Yay!</button></div>`);
    say(`You got ${gsp.name}!`);
    render();
  },
  tradeSkip: a => { S.offers[+a] = genOffer(+a); save(); sfx('pop'); render(); },
  tradeNew: () => { S.offers = [genOffer(0), genOffer(1), genOffer(2)]; save(); sfx('pop'); render(); },
  trainSel: a => { trainSel = +a; render(); },
  trainGo: a => { const d = getD(trainSel); if (!d || S.fish < 2) return; a === 'strength' ? trainPush(d) : trainTargets(d, a); },
  raceSel: a => { raceSel = +a; render(); },
  raceGo: a => { const d = getD(raceSel); if (d) playRace(d, TIERS[+a]); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset.arg, b);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') { closeModal(); render(); } });

render();
setInterval(() => { if (S && !drag && !sleeping) tickAll(); }, 60000);
</script>
